<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anubhav | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <div class="overlay">

            <h1>अनुभव - An Experience </h1>

            <p>
                Share Experiences.<br>
                Inspire Juniors.<br>
                Let's Learn Together.
            </p>

        </div>

    </div>


    <div class="right">

        <div class="login-card">

            <div class="avatar">
                👤
            </div>

            <h2>LOGIN</h2>

            <form id="loginForm">

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
